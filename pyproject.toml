# Tool configuration only (Black / isort / pytest / mypy).
# Dependencies live in requirements*.txt (venv + pip), not here.

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "google"
line_length = 88
# Override the google profile's one-import-per-line: group names from the same module
# into a single parenthesized `from x import (a, b, ...)` block.
force_single_line = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
